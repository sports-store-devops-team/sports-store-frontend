log_format sports_store_json escape=json
    '{"timestamp":"$time_iso8601","level":"info","service":"frontend",'
    '"method":"$request_method","status":$status,'
    '"duration_seconds":$request_time,"event":"http_access"}';

access_log /dev/stdout sports_store_json;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# The exporter sidecar shares the Pod network namespace. Binding this status
# listener to loopback keeps it unreachable from Services, Ingress, and ALB.
server {
    listen 127.0.0.1:8081;
    server_name localhost;

    location = /stub_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        deny all;
    }
}
