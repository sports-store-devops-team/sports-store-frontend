name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Lint and Test
        run: |
          npm run lint --if-present
          npm test --if-present
      - name: Build
        run: npm run build --if-present

  docker-build-and-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::324621154117:role/sports-store-github-ecr-publisher
          aws-region: eu-central-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract metadata
        id: meta
        run: |
          VERSION=$(cat VERSION || echo "0.1.0")
          GIT_HASH=$(git rev-parse --short HEAD)
          echo "tag=${VERSION}-${GIT_HASH}" >> $GITHUB_OUTPUT

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: sports-store-frontend
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  update-deployment:
    needs: docker-build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployments repo
        uses: actions/checkout@v4
        with:
          repository: sports-store-devops-team/sports-store-deployments
          token: ${{ secrets.DEPLOYMENTS_REPO_PAT }}
          ref: YuvalBranch

      - name: Update image tag in values-aws.yaml
        env:
          IMAGE_TAG: ${{ needs.docker-build-and-push.outputs.image_tag }}
        run: |
          sed -i "/repository: sports-store-frontend/{n; s/tag: .*/tag: ${IMAGE_TAG}/}" helm/sports-store/values-aws.yaml
          echo "Updated frontend image tag to: ${IMAGE_TAG}"

      - name: Commit and push
        env:
          IMAGE_TAG: ${{ needs.docker-build-and-push.outputs.image_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/sports-store/values-aws.yaml
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "ci(frontend): update image tag to ${IMAGE_TAG}"
          git push
