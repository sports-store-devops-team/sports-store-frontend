name: CI

run-name: ${{ github.event_name == 'workflow_dispatch' && format('Deploy {0}', inputs.deployment_id) || format('CI {0} {1}', github.event_name, github.sha) }}

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full lowercase commit SHA expected from the remote main branch
        required: true
        type: string
      deployment_id:
        description: Unique non-secret deployment correlation identifier
        required: true
        type: string
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Local CI validation image only; production frontend publication uses S3.
  ECR_REPOSITORY: sports-store-frontend

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Validate manual publication request
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == 'refs/heads/main' ]] || { echo '::error::Manual publication requires the main branch.'; exit 1; }
          [[ "${EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::The expected SHA is malformed.'; exit 1; }
          [[ "${EXPECTED_SHA}" == "${GITHUB_SHA}" ]] || { echo '::error::The expected SHA does not match the dispatched revision.'; exit 1; }
          [[ "${DEPLOYMENT_ID}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]] || { echo '::error::The deployment identifier is malformed.'; exit 1; }
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run frontend tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.2.0
        with:
          dockerfile: Dockerfile

      - name: Build validation image
        run: docker build --tag "${ECR_REPOSITORY}:ci-${GITHUB_SHA}" .

      - name: Scan filesystem and dependencies
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Scan validation image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: "${{ env.ECR_REPOSITORY }}:ci-${{ github.sha }}"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

  publish-static-site:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.expected_sha == github.sha)
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate static publication configuration
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_STATIC_SITE_ROLE_ARN: ${{ vars.AWS_STATIC_SITE_ROLE_ARN }}
          AWS_STATIC_SITE_BUCKET: ${{ vars.AWS_STATIC_SITE_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${AWS_REGION}" =~ ^[a-z]{2}(-gov)?-[a-z]+-[0-9]$ ]] || { echo "::error::Required Actions variable AWS_REGION is absent or malformed."; exit 1; }
          [[ "${AWS_STATIC_SITE_ROLE_ARN}" =~ ^arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+$ ]] || { echo "::error::Required Actions variable AWS_STATIC_SITE_ROLE_ARN is absent or malformed."; exit 1; }
          [[ "${AWS_STATIC_SITE_BUCKET}" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]] || { echo "::error::Required Actions variable AWS_STATIC_SITE_BUCKET is absent or malformed."; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Build production static site
        run: npm run build

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_STATIC_SITE_ROLE_ARN }}
          role-session-name: sports-store-frontend-static-publish

      - name: Publish frontend with cache-safe headers
        env:
          AWS_STATIC_SITE_BUCKET: ${{ vars.AWS_STATIC_SITE_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          aws s3 sync dist/ "s3://${AWS_STATIC_SITE_BUCKET}/" \
            --delete \
            --exclude 'assets/*' \
            --cache-control 'no-cache'
          aws s3 sync dist/assets/ "s3://${AWS_STATIC_SITE_BUCKET}/assets/" \
            --delete \
            --cache-control 'public,max-age=31536000,immutable'

      - name: Add publication summary
        run: |
          {
            echo "### Published static frontend"
            echo "- Hashed assets use immutable one-year caching."
            echo "- HTML and other entry files use no-cache."
          } >> "${GITHUB_STEP_SUMMARY}"
